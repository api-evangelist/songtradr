apis:
- name: Songtradr API
  description: >-
    JWT-authenticated REST API for deep music metadata and auto-tagging. Log in via POST /api/v1/user/login to obtain a
    bearer JWT, then manage your account and musicube cloud data, initiate presigned-S3 audio uploads for auto-tagging,
    poll file processing status, and retrieve recordings with musical features, genre predictions, tags, taggrams and
    tag strengths. Also exposes similarity vectors by ISRC/track id and the allowed-values reference for musical
    features. Rate limited to 120 requests per minute.
  humanURL: https://api.songtradr.com/swagger-ui.html
  baseURL: https://api.songtradr.com
