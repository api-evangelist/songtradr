aid: songtradr
name: Songtradr
description: >-
  Songtradr is a Santa Monica, California B2B music company that builds licensing, rights and music-data
  infrastructure for brands, agencies, digital platforms, artists and rightsholders. Founded in 2014, it operates a
  global sync-licensing marketplace alongside acquired businesses including Bandcamp, 7digital, MassiveMusic, Big Sync
  Music and the AI music-metadata company Musicube. Its public developer surface is the Songtradr API — a JWT-authenticated
  REST API, documented with a live OpenAPI 3.1 description, that returns deep music metadata (musical features, genre
  predictions, tags, taggrams, tag strengths, contributors, similarity vectors) and drives auto-tagging: rightsholders
  upload audio through a presigned S3 link and Songtradr's models classify it against a taxonomy of 350+ descriptive tags
  across 30+ categories, then expose semantic search over the results. First-party API clients are published for Python,
  JavaScript/Node and Ruby.
